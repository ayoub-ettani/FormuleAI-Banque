<div class="header-row">
  <h1>Demandes de credit</h1>
  <a routerLink="/demandes/nouvelle" class="btn-primary">+ Nouvelle demande</a>
</div>

<div class="filters">
  <label>Filtrer par statut :</label>
  <select [(ngModel)]="filtreStatut" name="filtre">
    <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
  </select>
</div>

<p *ngIf="isLoading">Chargement...</p>

<table class="table" *ngIf="!isLoading">
  <thead>
  <tr>
    <th>ID</th>
    <th>Client</th>
    <th>Montant</th>
    <th>Duree</th>
    <th>Statut</th>
    <th>Score</th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let d of demandesFiltrees">
    <td>{{ d.id }}</td>
    <td>{{ d.clientNom }}</td>
    <td>{{ d.montantDemande | number:'1.0-0' }} DH</td>
    <td>{{ d.dureeMois }} mois</td>
    <td><span class="badge" [ngClass]="statutClass(d.statut)">{{ d.statut }}</span></td>
    <td>{{ d.scoreSimplifie }}/100</td>
    <td><a [routerLink]="['/demandes', d.id]">Voir</a></td>
  </tr>
  </tbody>
</table>

<p *ngIf="!isLoading && demandesFiltrees.length === 0" class="placeholder">
  Aucune demande pour ce filtre.
</p>
