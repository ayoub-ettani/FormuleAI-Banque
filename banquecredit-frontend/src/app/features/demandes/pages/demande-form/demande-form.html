<p>demande-form works!</p>
<div>
    <form [formGroup]="form" (ngSubmit)="enregistrer()">
        <h2>Nouvelle demande</h2>
        <div class="form-group">
            <label >client</label>
            <select formControlName="clientId">
                <option value="Sélectionner un client"></option>
                @for (client of clients; track client.id)
                {
                    <option [value]="client.id">
                        {{client.nom}}
                    </option>
                }
            </select>
        </div>
        <div class="form-group">
            <label>Montant demandé</label>
            <input type="number" formControlName="montantDemande">
        </div>
        <div class="form-group">
            <label>Durée (Mois)</label>
            <input type="number" formControlName="dureeMois">
        </div>
        <div class="form-group">
            <label>Taux fictif %</label>
            <input type="number" step="0.1" formControlName="tauxFictif">
        </div>
        <button type="submit" [disabled]="form.invalid">Enregistrer</button>
    </form>
</div>
