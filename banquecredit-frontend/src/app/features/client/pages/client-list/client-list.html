<div class="header-row">
    <h1>Liste des clients</h1>
    <button class="btn-primary" routerLink="/clients/new">+ Nouveau client</button>
</div>

    <table class="table" border="1">
        <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>revenu mensuel</th>
                <th>charges mensuelles</th>
                <th>situation pro</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (client of clients; track client.email) {
                <tr>
                    <td>{{client.nom}}</td>
                    <td>{{client.email}}</td>
                    <td>{{client.revenuMensuel}}</td>
                    <td>{{client.chargesMensuelles}}</td>
                    <td>{{client.situationProfessionnelle}}</td>
                    <td class="actions">
                        <button class="btn-danger" (click)="deleteClient(client.id)">Supprimer</button>
                        <button class="btn-primary" routerLink="/clients/update/{{client.id}}">Modifier</button>

                    </td>
                </tr>
            }
            @empty {
                <tr>
                    <td colspan="6" class="placeholder">Aucun client trouvé.</td>
                </tr>
            }

        </tbody>
 
    </table>
